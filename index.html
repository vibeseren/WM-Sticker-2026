<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#1D9E75">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WM Sticker">
<title>WM 2026 Sticker Tracker</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f5f5f5;--surface:#fff;--text:#1a1a1a;--text2:#888;--text3:#aaa;
    --border:#e5e5e5;--shadow:rgba(0,0,0,0.07);
    --green:#1D9E75;--green-bg:#EAF3DE;--green-text:#3B6D11;--green-border:#97C459;
    --amber:#BA7517;--amber-bg:#FAEEDA;--amber-text:#854F0B;--amber-border:#EF9F27;
    --red:#e24b4a;--sync-bg:#f5f5f5;
  }
  body.dark{
    --bg:#111;--surface:#1e1e1e;--text:#f0f0f0;--text2:#999;--text3:#666;
    --border:#333;--shadow:rgba(0,0,0,0.4);
    --green-bg:#0d2e1f;--green-text:#5fcf9a;--green-border:#1D9E75;
    --amber-bg:#2e1f00;--amber-text:#f0a830;--amber-border:#BA7517;
    --sync-bg:#2a2a2a;
  }
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background 0.2s,color 0.2s}
  .topbar{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;transition:background 0.2s}
  .topbar-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .app-title{font-size:17px;font-weight:600;color:var(--text)}
  .topbar-actions{display:flex;align-items:center;gap:8px}
  .dark-toggle{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--sync-bg);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:background 0.2s;line-height:1}
  .sync-badge{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2);background:var(--sync-bg);padding:4px 10px;border-radius:99px}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:#ccc;transition:background 0.3s}
  .sync-dot.ok{background:var(--green)}
  .sync-dot.err{background:var(--red)}
  .sync-dot.loading{background:var(--amber);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
  .progress-wrap{margin-top:6px}
  .progress-bar-bg{background:var(--border);border-radius:99px;height:8px;overflow:hidden}
  .progress-bar-fill{height:100%;border-radius:99px;background:var(--green);transition:width 0.4s}
  .progress-label{font-size:11px;color:var(--text2);margin-top:3px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 16px}
  .stat{background:var(--surface);border-radius:12px;padding:10px;text-align:center;box-shadow:0 1px 3px var(--shadow);border:1px solid transparent;transition:transform 0.1s}
  .stat.clickable{cursor:pointer}
  .stat.clickable:active{transform:scale(0.97)}
  .stat-num{font-size:22px;font-weight:600}
  .stat-lbl{font-size:11px;color:var(--text2);margin-top:2px}
  .c-green{color:var(--green)}.c-red{color:var(--red)}.c-amber{color:var(--amber)}
  .search-wrap{padding:0 16px 10px}
  .search-wrap input{width:100%;padding:10px 14px;font-size:15px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);outline:none}
  .search-wrap input:focus{border-color:var(--green)}
  .legend{display:flex;gap:14px;padding:0 16px 10px;flex-wrap:wrap;align-items:flex-start}
  .legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2)}
  .legend-dot{width:13px;height:13px;border-radius:3px;border:1px solid var(--border)}
  .hint{font-size:11px;color:var(--text3);margin-left:auto;line-height:1.4}
  .teams{padding:0 16px 80px;display:flex;flex-direction:column;gap:10px}
  .team-section{background:var(--surface);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px var(--shadow)}
  .team-header{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
  .team-header:active{background:var(--bg)}
  .team-name{font-size:15px;font-weight:500;color:var(--text)}
  .team-right{display:flex;align-items:center;gap:8px}
  .team-progress{font-size:12px;color:var(--text2)}
  .team-chevron{font-size:12px;color:var(--text3);transition:transform 0.2s}
  .team-section.open .team-chevron{transform:rotate(180deg)}
  .stickers-grid{display:none;grid-template-columns:repeat(6,1fr);gap:7px;padding:12px}
  .team-section.open .stickers-grid{display:grid}
  .sticker{aspect-ratio:1;border-radius:8px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:10px;font-weight:600;color:var(--text3);position:relative;user-select:none;-webkit-tap-highlight-color:transparent;transition:background 0.12s,border-color 0.12s;min-height:44px}
  .sticker:active{opacity:0.7}
  .sticker.have{background:var(--green-bg);color:var(--green-text);border-color:var(--green-border)}
  .sticker.double{background:var(--amber-bg);color:var(--amber-text);border-color:var(--amber-border)}
  .double-badge{position:absolute;top:2px;right:3px;font-size:8px;font-weight:700;color:var(--amber-text)}
  /* Modal */
  .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:200;display:none;align-items:flex-end;justify-content:center}
  .modal-overlay.open{display:flex}
  .modal{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:500px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
  .modal-header{padding:16px 20px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
  .modal-title{font-size:16px;font-weight:600;color:var(--text)}
  .modal-close{font-size:22px;cursor:pointer;color:var(--text2);line-height:1;padding:4px}
  .modal-body{overflow-y:auto;padding:12px 16px 24px;flex:1}
  .modal-team{margin-bottom:16px}
  .modal-team-name{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--border)}
  .modal-stickers{display:flex;flex-wrap:wrap;gap:6px}
  .modal-sticker{padding:5px 10px;border-radius:8px;font-size:13px;font-weight:600}
  .modal-sticker.have{background:var(--green-bg);color:var(--green-text);border:1px solid var(--green-border)}
  .modal-sticker.double{background:var(--amber-bg);color:var(--amber-text);border:1px solid var(--amber-border)}
  .modal-empty{text-align:center;padding:40px 20px;color:var(--text2);font-size:14px}
</style>
</head>
<body>

<div id="main-app">
  <div class="topbar">
    <div class="topbar-row">
      <div class="app-title">⚽ WM 2026 Sticker</div>
      <div class="topbar-actions">
        <div class="sync-badge">
          <div class="sync-dot loading" id="sync-dot"></div>
          <span id="sync-label">Verbinde...</span>
        </div>
        <button class="dark-toggle" onclick="toggleDark()" id="dark-btn" title="Dunkles Design">🌙</button>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="main-bar" style="width:0%"></div></div>
      <div class="progress-label" id="progress-label">0 von 980 Stickern gesammelt</div>
    </div>
  </div>

  <div class="stats">
    <div class="stat clickable" onclick="openModal('have')">
      <div class="stat-num c-green" id="s-have">0</div>
      <div class="stat-lbl">Vorhanden</div>
    </div>
    <div class="stat">
      <div class="stat-num c-red" id="s-miss">980</div>
      <div class="stat-lbl">Fehlend</div>
    </div>
    <div class="stat clickable" onclick="openModal('double')">
      <div class="stat-num c-amber" id="s-dbl">0</div>
      <div class="stat-lbl">Doppelt</div>
    </div>
  </div>

  <div class="search-wrap">
    <input type="text" id="search" placeholder="🔍  Team suchen..." oninput="filterTeams(this.value)">
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--green-bg);border-color:var(--green-border)"></div>Vorhanden</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--amber-bg);border-color:var(--amber-border)"></div>Doppelt</div>
    <div class="legend-item"><div class="legend-dot"></div>Fehlend</div>
    <div class="hint">1× = vorhanden · 2× = doppelt · 3× = fehlend</div>
  </div>

  <div class="teams" id="teams-container"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-close" onclick="closeModal()">✕</div>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyB2wNjAuzf6WJUx-N4zKTZd5mqQgPUP_Nc",
  authDomain:        "wmsticker-92f93.firebaseapp.com",
  databaseURL:       "https://wmsticker-92f93-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:         "wmsticker-92f93",
  storageBucket:     "wmsticker-92f93.firebasestorage.app",
  messagingSenderId: "899376169715",
  appId:             "1:899376169715:web:4fe2508f8a075b940fed86"
};

// Alle 48 WM 2026 Teams in korrekter Album-Reihenfolge
const TEAMS=[
  {name:"Mexiko",              flag:"🇲🇽", count:20},
  {name:"Südafrika",           flag:"🇿🇦", count:20},
  {name:"Südkorea",            flag:"🇰🇷", count:20},
  {name:"Tschechien",          flag:"🇨🇿", count:20},
  {name:"Kanada",              flag:"🇨🇦", count:20},
  {name:"Bosnien und Herzeg.", flag:"🇧🇦", count:20},
  {name:"Katar",               flag:"🇶🇦", count:20},
  {name:"Schweiz",             flag:"🇨🇭", count:20},
  {name:"Brasilien",           flag:"🇧🇷", count:20},
  {name:"Marokko",             flag:"🇲🇦", count:20},
  {name:"Haiti",               flag:"🇭🇹", count:20},
  {name:"Schottland",          flag:"🏴󠁧󠁢󠁳󠁣󠁴󠁿", count:20},
  {name:"USA",                 flag:"🇺🇸", count:20},
  {name:"Paraguay",            flag:"🇵🇾", count:20},
  {name:"Australien",          flag:"🇦🇺", count:20},
  {name:"Türkei",              flag:"🇹🇷", count:20},
  {name:"Deutschland",         flag:"🇩🇪", count:20},
  {name:"Curaçao",             flag:"🇨🇼", count:20},
  {name:"Elfenbeinküste",      flag:"🇨🇮", count:20},
  {name:"Ecuador",             flag:"🇪🇨", count:20},
  {name:"Niederlande",         flag:"🇳🇱", count:20},
  {name:"Japan",               flag:"🇯🇵", count:20},
  {name:"Schweden",            flag:"🇸🇪", count:20},
  {name:"Tunesien",            flag:"🇹🇳", count:20},
  {name:"Belgien",             flag:"🇧🇪", count:20},
  {name:"Ägypten",             flag:"🇪🇬", count:20},
  {name:"Iran",                flag:"🇮🇷", count:20},
  {name:"Neuseeland",          flag:"🇳🇿", count:20},
  {name:"Spanien",             flag:"🇪🇸", count:20},
  {name:"Kap Verde",           flag:"🇨🇻", count:20},
  {name:"Saudi-Arabien",       flag:"🇸🇦", count:20},
  {name:"Uruguay",             flag:"🇺🇾", count:20},
  {name:"Frankreich",          flag:"🇫🇷", count:20},
  {name:"Senegal",             flag:"🇸🇳", count:20},
  {name:"Irak",                flag:"🇮🇶", count:20},
  {name:"Norwegen",            flag:"🇳🇴", count:20},
  {name:"Argentinien",         flag:"🇦🇷", count:20},
  {name:"Algerien",            flag:"🇩🇿", count:20},
  {name:"Österreich",          flag:"🇦🇹", count:20},
  {name:"Jordanien",           flag:"🇯🇴", count:20},
  {name:"Portugal",            flag:"🇵🇹", count:20},
  {name:"DR Kongo",            flag:"🇨🇩", count:20},
  {name:"Usbekistan",          flag:"🇺🇿", count:20},
  {name:"Kolumbien",           flag:"🇨🇴", count:20},
  {name:"England",             flag:"🏴󠁧󠁢󠁥󠁮󠁧󠁿", count:20},
  {name:"Kroatien",            flag:"🇭🇷", count:20},
  {name:"Ghana",               flag:"🇬🇭", count:20},
  {name:"Panama",              flag:"🇵🇦", count:20},
  // Specials
  {name:"Starter/Specials",    flag:"⭐", count:20},
];

const TOTAL=TEAMS.reduce((a,t)=>a+t.count,0);
const FIXED_USER='default';
let stickersState={};
let db=null, dbRef=null, saveTimer=null, firebaseOk=false;

// Dark mode
function toggleDark(){
  const isDark=document.body.classList.toggle('dark');
  localStorage.setItem('wm2026_dark',isDark?'1':'0');
  document.getElementById('dark-btn').textContent=isDark?'☀️':'🌙';
}
if(localStorage.getItem('wm2026_dark')==='1'){
  document.body.classList.add('dark');
  window.addEventListener('DOMContentLoaded',()=>{ const b=document.getElementById('dark-btn'); if(b) b.textContent='☀️'; });
}

// Firebase
function initFirebase(){
  try{ firebase.initializeApp(FIREBASE_CONFIG); db=firebase.database(); firebaseOk=true; }
  catch(e){ setSyncStatus('err','Nur lokal'); }
}
function setSyncStatus(state,msg){
  document.getElementById('sync-dot').className='sync-dot '+state;
  document.getElementById('sync-label').textContent=msg;
}
async function loadData(){
  setSyncStatus('loading','Lade...');
  if(firebaseOk&&db){
    dbRef=db.ref('users/'+FIXED_USER+'/stickers');
    dbRef.on('value',(snap)=>{
      stickersState=snap.val()||{};
      refreshAllStickers();
      updateStats();
      TEAMS.forEach((_,i)=>updateTeamProgress(i));
      setSyncStatus('ok','Live synchronisiert');
    },(err)=>{ setSyncStatus('err','Sync-Fehler'); loadLocal(); });
  } else { loadLocal(); setSyncStatus('err','Lokal gespeichert'); }
}
function loadLocal(){ try{ stickersState=JSON.parse(localStorage.getItem('wm2026_data')||'{}'); }catch(e){ stickersState={}; } }
function saveLocal(){ try{ localStorage.setItem('wm2026_data',JSON.stringify(stickersState)); }catch(e){} }
function scheduleSave(){
  saveLocal();
  if(!firebaseOk||!dbRef) return;
  if(saveTimer) clearTimeout(saveTimer);
  setSyncStatus('loading','Speichere...');
  saveTimer=setTimeout(()=>{
    dbRef.set(stickersState)
      .then(()=>setSyncStatus('ok','Gespeichert ✓'))
      .catch(()=>setSyncStatus('err','Speichern fehlgeschlagen'));
  },600);
}

function getKey(ti,si){ return 's'+ti+'_'+si }
function cycleSticker(key){
  const cur=stickersState[key]||0;
  if(cur===0) stickersState[key]=1;
  else if(cur===1) stickersState[key]=2;
  else delete stickersState[key];
  scheduleSave(); updateStats();
  const el=document.getElementById('el_'+key);
  if(el) applyClass(el,stickersState[key]||0);
  const ti=parseInt(key.replace('s','').split('_')[0]);
  updateTeamProgress(ti);
}
function applyClass(el,state){
  el.className='sticker '+(['','have','double'][state]||'');
  const b=el.querySelector('.double-badge');
  if(state===2){ if(!b){const d=document.createElement('div');d.className='double-badge';d.textContent='×2';el.appendChild(d);} }
  else{ if(b) b.remove(); }
}
function refreshAllStickers(){
  TEAMS.forEach((team,ti)=>{
    for(let s=0;s<team.count;s++){
      const el=document.getElementById('el_'+getKey(ti,s));
      if(el) applyClass(el,stickersState[getKey(ti,s)]||0);
    }
  });
}
function updateTeamProgress(ti){
  let have=0;
  for(let s=0;s<TEAMS[ti].count;s++){ if((stickersState[getKey(ti,s)]||0)>0) have++; }
  const el=document.getElementById('tp_'+ti);
  if(el) el.textContent=have+'/'+TEAMS[ti].count;
}
function updateStats(){
  let have=0,dbl=0;
  for(const k in stickersState){
    const v=stickersState[k];
    if(v===1) have++;
    else if(v===2){ have++;dbl++; }
  }
  document.getElementById('s-have').textContent=have;
  document.getElementById('s-miss').textContent=TOTAL-have;
  document.getElementById('s-dbl').textContent=dbl;
  const pct=Math.round(have/TOTAL*100);
  document.getElementById('main-bar').style.width=pct+'%';
  document.getElementById('progress-label').textContent=have+' von '+TOTAL+' Stickern gesammelt ('+pct+'%)';
}

// Modal
function openModal(type){
  const isDouble=type==='double';
  document.getElementById('modal-title').textContent=isDouble?'🟡 Meine Doppelten':'🟢 Meine Vorhandenen';
  const body=document.getElementById('modal-body');
  body.innerHTML='';
  let total=0;
  TEAMS.forEach((team,ti)=>{
    const list=[];
    for(let s=0;s<team.count;s++){
      const v=stickersState[getKey(ti,s)]||0;
      if(isDouble&&v===2) list.push(s+1);
      else if(!isDouble&&v>=1) list.push(s+1);
    }
    if(!list.length) return;
    total+=list.length;
    const sec=document.createElement('div');
    sec.className='modal-team';
    sec.innerHTML='<div class="modal-team-name">'+team.flag+' '+team.name+'</div>';
    const wrap=document.createElement('div');
    wrap.className='modal-stickers';
    list.forEach(n=>{ const sp=document.createElement('span'); sp.className='modal-sticker '+(isDouble?'double':'have'); sp.textContent=n; wrap.appendChild(sp); });
    sec.appendChild(wrap);
    body.appendChild(sec);
  });
  if(!total) body.innerHTML='<div class="modal-empty">'+(isDouble?'Noch keine doppelten Sticker':'Noch keine Sticker als vorhanden markiert')+'</div>';
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal(){ document.getElementById('modal-overlay').classList.remove('open'); }
function closeModalOutside(e){ if(e.target===document.getElementById('modal-overlay')) closeModal(); }

function buildTeam(ti,team){
  const sec=document.createElement('div');
  sec.className='team-section'; sec.id='team_'+ti;
  const hdr=document.createElement('div');
  hdr.className='team-header';
  hdr.innerHTML=`<span class="team-name">${team.flag} ${team.name}</span><div class="team-right"><span class="team-progress" id="tp_${ti}">0/${team.count}</span><span class="team-chevron">▼</span></div>`;
  hdr.onclick=()=>sec.classList.toggle('open');
  const grid=document.createElement('div');
  grid.className='stickers-grid';
  for(let s=0;s<team.count;s++){
    const key=getKey(ti,s);
    const div=document.createElement('div');
    div.id='el_'+key; div.className='sticker';
    div.textContent=s+1;
    applyClass(div,stickersState[key]||0);
    div.onclick=()=>cycleSticker(key);
    grid.appendChild(div);
  }
  sec.appendChild(hdr); sec.appendChild(grid);
  return sec;
}
function filterTeams(q){
  TEAMS.forEach((t,i)=>{
    const s=document.getElementById('team_'+i);
    if(s) s.style.display=t.name.toLowerCase().includes(q.toLowerCase())?'':'none';
  });
}

initFirebase();
const container=document.getElementById('teams-container');
TEAMS.forEach((t,i)=>container.appendChild(buildTeam(i,t)));
loadData();
updateStats();
TEAMS.forEach((_,i)=>updateTeamProgress(i));
</script>
</body>
</html>
